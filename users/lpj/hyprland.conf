# Minimal Hyprland config — just enough to log in, open a terminal, and quit.
# Replace later with the end-4/dots-hyprland setup.

# --- Environment ------------------------------------------------------------
# Software rendering fallback for VirtualBox VMs without working GPU passthrough.
# Remove these lines on bare metal or QEMU+virtio-gpu.
env = WLR_RENDERER,pixman
env = WLR_NO_HARDWARE_CURSORS,1
env = LIBGL_ALWAYS_SOFTWARE,1

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# --- Monitors ---------------------------------------------------------------
monitor = , preferred, auto, 1

# --- Input ------------------------------------------------------------------
input {
  kb_layout = de
  follow_mouse = 1
  touchpad {
    natural_scroll = false
  }
}

general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  layout = dwindle
}

decoration {
  rounding = 6
}

animations {
  enabled = false
}

# --- Autostart --------------------------------------------------------------
# (intentionally empty for the minimal config)

# --- Keybindings ------------------------------------------------------------
$mod = SUPER

bind = $mod, Return, exec, kitty
bind = $mod, D, exec, wofi --show drun
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating

# Focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Mouse drag windows
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
